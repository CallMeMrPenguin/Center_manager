[Application]
name=Center Manager
version=1.0.0
entry_point=main:main
publisher=Center Manager
icon=installer/app.ico

[Python]
version=3.13.0
bitness=64

[Include]
packages=fastapi
    uvicorn
    starlette
    pydantic
    docx
    requests
    urllib3
    lxml
    PIL
    openpyxl
    statsmodels
    scipy
    pandas
    patsy

files=../backend
    ../frontend/dist
    ../main.py
    ../main_background.pyw
    ../updater.py
    ../start.bat
    ../VERSION
    ../workspace_files
    ../config.json
    ../unit_config.json
    ../exercise_config.json
    ../prompts.json
    ../app.ico

[Shortcut Center Manager]
entry_point=main:main
console=true
icon=installer/app.ico

[Shortcut Center Manager Background]
entry_point=main_background:main
console=false
icon=installer/app.ico