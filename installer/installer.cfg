[Application]
name=Center Manager
version=1.0.0
entry_point=main.py
icon=installer/icon.ico
publisher=Center Manager

[Python]
version=3.13.0
bitness=64

[Include]
packages=fastapi
    uvicorn
    uvicorn.lifespan.on
    uvicorn.protocols.http.auto
    uvicorn.protocols.websockets.auto
    python_multipart
    starlette
    pydantic
    pydantic_core
    python-docx
    docx
    docxcompose
    requests
    urllib3
    certifi
    charset_normalizer
    idna
    packaging
    aiofiles
    anyio
    sniffio
    h11
    httptools
    watchfiles
    websockets
    click
    typing_extensions
    annotated_types
    lxml
    Pillow
    sqlite3
    json
    csv
    tkinter
    openpyxl
    et_xmlfile
pypi_wheels=

files=backend/
    frontend/dist/
    main.py
    main_background.pyw
    updater.py
    start.bat
    VERSION
    workspace_files/
    config.json
    unit_config.json
    exercise_config.json
    prompts.json

[Shortcut application]
name=Center Manager
target=$INSTDIR\Center Manager.exe
working_directory=$INSTDIR
icon=$INSTDIR\Center Manager.exe

[Shortcut application]
name=Center Manager (Nền)
target=$INSTDIR\main_background.exe
working_directory=$INSTDIR
