version: '3.8'

services:
  # 1. Self-hosted PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: center_manager_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-center_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-center_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-center_manager}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/postgres_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-center_user} -d ${POSTGRES_DB:-center_manager}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: center_manager_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - APP_MODE=web
      - DATABASE_URL=postgresql://${POSTGRES_USER:-center_user}:${POSTGRES_PASSWORD:-center_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-center_manager}
      - ALLOWED_ORIGINS=*
    ports:
      - "8000:8000"
    volumes:
      - app_files:/app/backend/files

volumes:
  postgres_data:
    driver: local
  app_files:
    driver: local
